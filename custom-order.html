<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش اختصاصی | نئون‌ساز</title><link rel="stylesheet" href="public/css/neon-store.css"></head><body><main class="section"><div class="container"><a href="index.html">← صفحه اصلی</a><h1>سفارش اختصاصی</h1><p class="lead">جزئیات ایده خود را وارد کنید تا کارشناسان ما بررسی کنند.</p><form class="panel form-grid" data-demo-form><label class="field">نام و نام خانوادگی<input required name="name"></label><label class="field">شماره تماس<input required name="phone" type="tel"></label><label class="field">نوع سفارش<select name="type"><option>نئون فلکسی</option><option>تابلو نئون</option><option>تابلو تبلیغاتی</option><option>طراحی اختصاصی</option></select></label><label class="field">رنگ نور<input name="color" placeholder="سفید، آبی، صورتی..."></label><label class="field">ابعاد تقریبی<input name="size" placeholder="مثلاً ۱۲۰ در ۶۰ سانتی‌متر"></label><label class="field">محل نصب<input name="location"></label><label class="field full">متن یا توضیحات<textarea name="notes"></textarea></label><div class="field full"><button class="btn primary" type="submit">ثبت درخواست</button><p class="muted" data-result></p></div></form></div></main><script src="public/js/neon-store.js"></script></body></html>
