<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سبد خرید | نئون‌ساز</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080b18;--card:#11182b;--line:#263451;--text:#f4f7ff;--muted:#9aa8c7;--a:#56e8ff;--b:#9d7bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17234a,#080b18 45%);color:var(--text);font-family:Vazirmatn,Tahoma;min-height:100vh}a{text-decoration:none;color:inherit}.nav{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font-size:24px;font-weight:900;color:var(--a)}.wrap{max-width:1180px;margin:45px auto;padding:0 22px}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}.step{padding:11px 18px;border:1px solid var(--line);border-radius:30px;color:var(--muted)}.active{background:#173b52;color:var(--a);border-color:var(--a)}h1{font-size:34px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:22px}.card{background:#11182bdd;border:1px solid var(--line);border-radius:25px;padding:26px;box-shadow:0 20px 70px #0004}.item{display:flex;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.thumb{width:105px;height:105px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#172d48,#211d4b);color:var(--a);font-weight:900;text-shadow:0 0 18px var(--a)}.item h3{margin:0}.muted{color:var(--muted);font-size:13px}.price{margin-right:auto;font-weight:900;color:var(--a)}.qty{display:flex;gap:12px;align-items:center;margin-top:12px}.qty button{background:#1c2943;color:white;border:1px solid var(--line);border-radius:9px;width:32px;height:32px}.line{display:flex;justify-content:space-between;margin:18px 0;color:var(--muted)}.total{font-size:20px;color:var(--text);border-top:1px solid var(--line);padding-top:18px}.btn{display:block;text-align:center;background:linear-gradient(135deg,var(--a),var(--b));color:#08101c;padding:15px;border-radius:14px;font-weight:900;margin-top:22px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:27px}.item{align-items:flex-start}.thumb{width:80px;height:80px}}</style></head><body><nav class="nav"><a class="logo" href="index.html">✦ نئون‌ساز</a><a href="products.html">بازگشت به فروشگاه ←</a></nav><main class="wrap"><div class="steps"><span class="step active">۱ سبد خرید</span><span class="step">۲ ارسال</span><span class="step">۳ بازبینی</span><span class="step">۴ پرداخت</span></div><h1>سبد خرید شما</h1><div class="grid"><section class="card"><div class="item"><div class="thumb">NEON</div><div><h3>تابلو نئون سفارشی</h3><p class="muted">آبی یخی · ۶۰×۳۰ سانتی‌متر</p><div class="qty"><button onclick="change(-1)">−</button><b id="q">۱</b><button onclick="change(1)">+</button></div></div><strong class="price" id="p">۲٬۸۰۰٬۰۰۰ تومان</strong></div><div class="item"><div class="thumb">LED</div><div><h3>نئون LED دکوراتیو</h3><p class="muted">بنفش · آماده ارسال</p></div><strong class="price">۱٬۴۵۰٬۰۰۰ تومان</strong></div></section><aside class="card"><h2>خلاصه سفارش</h2><div class="line"><span>جمع کالاها</span><b id="sub">۴٬۲۵۰٬۰۰۰</b></div><div class="line"><span>ارسال</span><b>رایگان</b></div><div class="line total"><span>قابل پرداخت</span><b id="total">۴٬۲۵۰٬۰۰۰ تومان</b></div><a class="btn" href="transport.html">ادامه به ارسال ←</a></aside></div></main><script>let q=1;const f=n=>n.toLocaleString('fa-IR');function change(n){q=Math.max(1,Math.min(99,q+n));document.getElementById('q').textContent=f(q);document.getElementById('p').textContent=f(2800000*q)+' تومان';let s=2800000*q+1450000;document.getElementById('sub').textContent=f(s);document.getElementById('total').textContent=f(s)+' تومان'}</script></body></html>
