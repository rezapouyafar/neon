<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d">
<title>تأیید کد | نئون‌ساز</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{font-family:"Vazirmatn",Tahoma,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#202348 0,transparent 32%),radial-gradient(circle at 90% 90%,#27183e 0,transparent 35%),#08090d;color:#f7f8fb}.page{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,470px);padding:44px;background:rgba(16,18,25,.94);border:1px solid rgba(255,255,255,.09);border-radius:26px;box-shadow:0 30px 90px #0008}.brand{display:flex;align-items:center;gap:11px;margin-bottom:52px;font-size:19px;font-weight:800}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7ee8ff,#7c83ff);color:#080b12}.back{display:inline-block;color:#7f8797;font-size:12px;margin-bottom:28px}.back:hover{color:#aeb5ff}.eyebrow{font-size:11px;font-weight:700;color:#8991ff;margin-bottom:10px}.heading h1{font-size:27px;margin:0 0 12px}.heading p{font-size:13px;color:#9298a7;line-height:2;margin:0 0 30px}.otp{display:flex;direction:ltr;gap:10px;margin-bottom:20px}.otp input{width:100%;height:64px;min-width:0;text-align:center;font:700 25px "Vazirmatn",sans-serif;color:#fff;background:#151821;border:1px solid rgba(255,255,255,.1);border-radius:14px;outline:0}.otp input:focus{border-color:#7c83ff;box-shadow:0 0 0 4px #7c83ff18}.meta{display:flex;justify-content:space-between;align-items:center;color:#858c9c;font-size:11px;margin-bottom:24px}.meta strong{color:#aeb5ff;font-size:14px;direction:ltr}.btn{width:100%;height:58px;border:0;border-radius:14px;background:linear-gradient(135deg,#707aff,#916cf0);color:#fff;font:700 13px "Vazirmatn",sans-serif;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.resend{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:transparent;color:#aeb5ff;font:600 12px "Vazirmatn",sans-serif;cursor:pointer}.resend:disabled{color:#555c69;cursor:not-allowed}.result{min-height:22px;text-align:center;color:#aeb5ff;font-size:11px;margin:16px 0}.footer{border-top:1px solid #ffffff0d;margin-top:28px;padding-top:18px;text-align:center;color:#5e6573;font-size:10px}@media(max-width:500px){.card{padding:34px 22px;border-radius:22px}.otp{gap:7px}.otp input{height:57px;font-size:21px}}
</style></head>
<body><main class="page"><section class="card" aria-label="تأیید کد">
<a class="back" href="loginRegistration.html">← ویرایش ایمیل یا شماره موبایل</a><div class="brand"><span class="mark">N</span><span>نئون‌ساز</span></div>
<div class="heading"><div class="eyebrow">تأیید هویت · مرحله دوم</div><h1>کد تأیید را وارد کنید</h1><p>کد پنج‌رقمی ارسال‌شده را در کادرهای زیر وارد کنید.</p></div>
<form id="otpForm" novalidate><div class="otp" aria-label="کد پنج رقمی"><input maxlength="1" inputmode="numeric" aria-label="رقم اول" autofocus><input maxlength="1" inputmode="numeric" aria-label="رقم دوم"><input maxlength="1" inputmode="numeric" aria-label="رقم سوم"><input maxlength="1" inputmode="numeric" aria-label="رقم چهارم"><input maxlength="1" inputmode="numeric" aria-label="رقم پنجم"></div><div class="meta"><span>زمان باقی‌مانده</span><strong id="timer">01:30</strong></div><button class="resend" id="resend" type="button" disabled>ارسال مجدد کد</button><button class="btn" type="submit">تأیید و ادامه</button></form><p class="result" id="result" role="status"></p><div class="footer">کد تأیید خود را با هیچ‌کس به اشتراک نگذارید.</div>
</section></main>
<script>(function(){const fields=[...document.querySelectorAll('.otp input')],timerEl=document.getElementById('timer'),resend=document.getElementById('resend'),result=document.getElementById('result');fields.forEach((f,i)=>{f.addEventListener('input',()=>{f.value=f.value.replace(/\D/g,'').slice(0,1);if(f.value&&fields[i+1])fields[i+1].focus()});f.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!f.value&&fields[i-1])fields[i-1].focus()});f.addEventListener('paste',e=>{const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,5);if(!v)return;e.preventDefault();v.split('').forEach((d,j)=>{if(fields[j])fields[j].value=d});fields[Math.min(v.length,5)-1].focus()})});let seconds=90,interval;function start(){clearInterval(interval);seconds=90;resend.disabled=true;render();interval=setInterval(()=>{seconds--;render();if(seconds<=0){clearInterval(interval);resend.disabled=false}},1000)}function render(){timerEl.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}start();resend.addEventListener('click',()=>{result.textContent='کد جدید درخواست شد.';start()});document.getElementById('otpForm').addEventListener('submit',e=>{e.preventDefault();if(fields.some(f=>!f.value)){result.textContent='لطفاً هر پنج رقم کد را وارد کنید.';fields.find(f=>!f.value).focus();return}result.textContent='کد آماده بررسی است.'})})();</script></body></html>
