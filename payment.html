<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت | نئون‌ساز</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#090b16;--card:#12172a;--line:#29304a;--text:#f5f7ff;--muted:#9ba5c4;--a:#66e3ff;--b:#9b7bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#24204c,transparent 35%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:850px;margin:auto;padding:35px 20px}.head{padding:20px 6%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px}.logo span{color:var(--a)}a{text-decoration:none;color:inherit}.steps{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.step{border:1px solid var(--line);border-radius:30px;padding:10px 15px;color:var(--muted);font-size:12px}.active{border-color:var(--a);color:var(--a)}.card{background:linear-gradient(145deg,#151b31,#0e1324);border:1px solid var(--line);border-radius:25px;padding:28px;box-shadow:0 20px 50px #0004}.method{display:flex;align-items:center;gap:15px;border:1px solid var(--line);padding:18px;border-radius:16px;margin:12px 0}.method input{accent-color:var(--a)}.method strong{display:block}.muted{color:var(--muted);font-size:12px}.btn{display:block;text-align:center;border:0;border-radius:14px;padding:15px;margin-top:22px;font:inherit;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));color:#07101d;cursor:pointer}.notice{background:#18253a;color:#b9d9ff;padding:14px;border-radius:14px;font-size:12px;line-height:2;margin-top:20px}</style></head><body><header class="head"><a class="logo" href="index.html">نئون<span>‌ساز</span></a><a class="muted" href="review.html">بازگشت به بازبینی ←</a></header><main class="wrap"><div class="steps"><span class="step">۱. سبد خرید</span><span class="step">۲. ارسال</span><span class="step">۳. بازبینی</span><span class="step active">۴. پرداخت</span></div><section class="card"><h1>پرداخت سفارش</h1><p class="muted">روش پرداخت خود را انتخاب کنید.</p><label class="method"><input type="radio" name="pay" checked><div><strong>پرداخت آنلاین</strong><span class="muted">انتقال به درگاه امن پرداخت</span></div></label><label class="method"><input type="radio" name="pay"><div><strong>پرداخت کارت‌به‌کارت</strong><span class="muted">هماهنگی با پشتیبانی پس از ثبت سفارش</span></div></label><div class="notice">در نسخه فعلی، پرداخت کاملاً نمایشی است و هیچ تراکنش واقعی انجام نمی‌شود.</div><a class="btn" href="checkout.html">ادامه و ثبت نهایی سفارش ←</a></section></main></body></html>
