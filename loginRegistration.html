<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ورود به حساب کاربری نئون‌ساز با ایمیل یا شماره موبایل">
<meta name="theme-color" content="#08090d">
<title>ورود | نئون‌ساز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:"Vazirmatn",Tahoma,Arial,sans-serif;--bg:#08090d;--surface:#101218;--surface2:#151821;--text:#f6f7fb;--muted:#9298a7;--border:rgba(255,255,255,.09);--accent:#7c83ff}*{box-sizing:border-box}html{font-family:"Vazirmatn",Tahoma,Arial,sans-serif}body{margin:0;min-height:100vh;font-family:"Vazirmatn",Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,rgba(104,112,255,.14),transparent 30%),radial-gradient(circle at 90% 90%,rgba(162,85,255,.12),transparent 30%),var(--bg);-webkit-font-smoothing:antialiased}button,input{font:inherit}a{text-decoration:none;color:inherit}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,470px);padding:46px 44px;background:rgba(16,18,24,.92);border:1px solid var(--border);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:54px;font-weight:800;font-size:19px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7ee8ff,#7c83ff);color:#080b12;box-shadow:0 0 30px rgba(124,131,255,.25)}.back{display:inline-block;margin-bottom:28px;color:#777e8d;font-size:12px}.back:hover{color:#aeb5ff}.eyebrow{margin-bottom:10px;color:#8991ff;font-size:11px;font-weight:700}.heading h1{margin:0 0 10px;font-size:28px;letter-spacing:-.6px}.heading p{margin:0 0 30px;color:var(--muted);font-size:13px;line-height:2}.field{display:block;margin-bottom:16px;font-size:12px;font-weight:700}.input{display:block;width:100%;height:58px;margin-top:9px;padding:0 17px;border:1px solid var(--border);border-radius:14px;background:var(--surface2);color:#fff;outline:0;direction:rtl;transition:.2s}.input::placeholder{color:#666d7b}.input:focus{border-color:#737cff;box-shadow:0 0 0 4px rgba(124,131,255,.1)}.submit{width:100%;height:58px;border:0;border-radius:14px;background:linear-gradient(135deg,#707aff,#916cf0);color:#fff;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 12px 30px rgba(124,131,255,.18)}.submit:hover{transform:translateY(-1px);filter:brightness(1.07)}.result{min-height:20px;margin:16px 0 0;color:#8991ff;font-size:11px;text-align:center;line-height:1.9}.terms{margin:22px 0 0;color:#666d7b;font-size:10px;line-height:2;text-align:center}.terms a{color:#a1a8ff}.secure{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);color:#555c69;text-align:center;font-size:10px}@media(max-width:500px){.page{padding:14px}.card{padding:34px 23px;border-radius:22px}.brand{margin-bottom:42px}.heading h1{font-size:25px}}
</style>
</head>
<body>
<main class="page"><section class="card" aria-label="ورود به حساب کاربری">
<a class="back" href="index.html">← بازگشت به فروشگاه</a>
<div class="brand"><span class="mark">N</span><span>نئون‌ساز</span></div>
<div class="heading"><div class="eyebrow">حساب کاربری</div><h1>خوش آمدید</h1><p>برای ورود، ایمیل یا شماره موبایل خود را وارد کنید.</p></div>
<form id="identity-form" novalidate><label class="field" for="identity">ایمیل یا شماره موبایل<input class="input" id="identity" name="identity" type="text" inputmode="email" autocomplete="username" placeholder="ایمیل یا شماره موبایل شما" required></label><button class="submit" type="submit">ادامه</button></form>
<p class="result" id="result" role="status" aria-live="polite"></p><p class="terms">با ادامه، <a href="#">شرایط استفاده</a> و <a href="#">حریم خصوصی</a> را می‌پذیرید.</p><div class="secure">اتصال امن · نئون‌ساز</div>
</section></main>
<script>document.getElementById('identity-form').addEventListener('submit',function(e){e.preventDefault();const i=document.getElementById('identity'),r=document.getElementById('result'),v=i.value.trim();if(!v){r.textContent='لطفاً ایمیل یا شماره موبایل را وارد کنید.';i.focus();return}r.textContent='اطلاعات واردشده آماده ارسال است.'});</script>
</body></html>
